[catalog]
version = "0.2.0"
checked_at = "2026-10-16T20:53:06+08:00"
validation_note = "六個官方連接器均已取得真實資料並通過 live schema 驗證；本次補齊 TWSE 個股法人 T86 的 9/9 欄位。"

[[sources]]
id = "twse_openapi"
name = "臺灣證券交易所官方資料服務"
authority = "official"
base_url = "https://openapi.twse.com.tw/v1"
terms_url = "https://www.twse.com.tw/terms/"
storage_policy = "只保存研究必要的結構化欄位、來源 URL、取得時間與雜湊；依官方條款複核。"
authentication = "none"
rate_limit = "官方未在本專案中驗證；採低頻按需請求與快取"
history = "本批端點以近期/當日橫截面為主；歷史範圍需逐端點驗證"
update_schedule = "交易日收盤後；實際發布時間需監測"
priority = 1
fallback_sources = []
live_validation = "validated_3_of_3"

[[sources.endpoints]]
id = "twse.market.daily_all"
path = "/exchangeReport/STOCK_DAY_ALL"
categories = ["identity", "market"]
connector = "twse_market"

[[sources.endpoints]]
id = "twse.institutional.daily"
path = "https://www.twse.com.tw/rwd/zh/fund/T86?response=json&selectType=ALLBUT0999"
categories = ["institutional"]
connector = "twse_institutional"

[[sources.endpoints]]
id = "twse.margin.daily"
path = "/exchangeReport/MI_MARGN"
categories = ["margin"]
connector = "twse_margin"

