connector = "twse_institutional"

[[sources.endpoints]]
id = "twse.margin.daily"
path = "/exchangeReport/MI_MARGN"
categories = ["margin"]
connector = "twse_margin"

[[sources.endpoints]]
id = "twse.company.profile"
path = "/opendata/t187ap03_L"
categories = ["identity"]
connector = "twse_profile"
validation = "live_shape_sampled; see audit/company_source_shapes.json and company_live_twse.json"
