[matrix]
version = "0.5.0"

[[requirements]]
id = "REQ-DEGRADED-001"
statement = "Yahoo／技術不可用仍保留官方資料、逐欄缺漏、錯誤與研究紀錄；市場不明不猜測，無技術分析禁止正式交易決策"
catalog_prefixes = ["category.technical", "identity.", "market.", "material_events."]
implementation = ["src/tw_stock_swing/research.py", "src/tw_stock_swing/sources/company.py", "src/tw_stock_swing/formatting.py"]
tests = ["tests/test_research_degradation.py"]
status = "implemented"

[[requirements]]
id = "REQ-SELECTION-001"
statement = "初篩流動性、量價、完整調整基準、疑似缺列、唯一證券排名、幣別類型與成交一致性；完整日曆／公司行動仍待完成，失敗隔離見 REQ-DEGRADED-001"
catalog_prefixes = ["category.market", "category.volume_structure", "category.technical", "identity."]
implementation = ["SELECTION_POLICY.md", "src/tw_stock_swing/analysis.py", "src/tw_stock_swing/models.py", "src/tw_stock_swing/providers.py", "src/tw_stock_swing/cli.py", "src/tw_stock_swing/research.py", "src/tw_stock_swing/sources/official.py"]
tests = ["tests/test_selection_safety.py"]
status = "partial"

[[requirements]]
id = "REQ-COMPANY-001"
statement = "公司主檔六項與公告六項 metadata 契約、時間驗證、版本去重、缺漏揭露及研究落庫；不等於完整身分與重大事件研究"
catalog_prefixes = ["identity.legal_name", "identity.english_abbreviation", "identity.industry_code", "identity.listing_date", "identity.paid_in_capital", "identity.issue_shares_or_tdr_underlying", "material_events."]
implementation = ["src/tw_stock_swing/sources/company.py", "src/tw_stock_swing/research.py", "src/tw_stock_swing/storage.py", "src/tw_stock_swing/cli.py"]
tests = ["tests/test_company_sources.py"]
status = "partial"

[[requirements]]
id = "REQ-DATA-001"
statement = "23 大資料族群都必須出現在機器可讀目錄且有狀態"
catalog_prefixes = ["category."]
implementation = ["src/tw_stock_swing/catalog.py", "src/tw_stock_swing/coverage.py"]
tests = ["test_catalog_has_all_23_requirement_categories", "test_coverage_never_silently_omits_catalog_items"]
status = "implemented"

[[requirements]]
id = "REQ-DATA-002"
statement = "第一批行情、成交、法人、融資券欄位有唯一 ID、單位、優先級與來源"
catalog_prefixes = ["identity.", "market.", "institutional.", "margin."]
implementation = ["DATA_CATALOG.toml", "src/tw_stock_swing/sources/"]
tests = ["test_catalog_fields_are_unique_and_valid", "test_connector_contract_fields_exist_in_catalog"]
status = "implemented"

[[requirements]]
id = "REQ-SOURCE-001"
statement = "證交所與櫃買中心官方端點、授權檢查狀態、更新、歷史與 fallback 可追蹤"
catalog_prefixes = ["category.market", "category.institutional", "category.margin"]
implementation = ["SOURCE_CATALOG.toml", "src/tw_stock_swing/sources/official.py"]
tests = ["test_source_catalog_has_official_endpoints", "test_fixture_payloads_match_connector_contracts"]
status = "partial"

[[requirements]]
id = "REQ-TIME-001"
statement = "觀察值保存 valid_time、known_at、system_recorded_at 且修正不覆蓋舊版"
catalog_prefixes = ["category."]
implementation = ["src/tw_stock_swing/storage.py"]
tests = ["test_observation_revisions_are_append_only", "test_as_of_query_excludes_later_known_data"]
status = "implemented"

[[requirements]]
id = "REQ-EVIDENCE-001"
statement = "證據帳本保存主張類型、立場、來源、時間與品質維度"
catalog_prefixes = ["category."]
implementation = ["src/tw_stock_swing/storage.py"]
tests = ["test_evidence_ledger_preserves_quality_dimensions"]
status = "implemented"

[[requirements]]
id = "REQ-COVERAGE-001"
statement = "每個目錄項目恰有一個合法狀態；缺值、未實作與抓取失敗不得靜默消失"
catalog_prefixes = ["category.", "identity.", "market.", "institutional.", "margin."]
implementation = ["src/tw_stock_swing/coverage.py", "src/tw_stock_swing/storage.py"]
tests = ["test_coverage_never_silently_omits_catalog_items", "test_missing_p0_field_fails_strict_coverage"]
status = "implemented"

[[requirements]]
id = "REQ-RESEARCH-001"
statement = "單股研究指令整合歷史技術分析、官方行情、法人、融資券、來源健康與完整缺口揭露"
catalog_prefixes = ["category.", "identity.", "market.", "institutional.", "margin."]
implementation = ["src/tw_stock_swing/research.py", "src/tw_stock_swing/formatting.py", "src/tw_stock_swing/cli.py"]
tests = ["tests/test_research.py", "test_research_json_contract"]
status = "implemented"

[[requirements]]
id = "REQ-COMPAT-001"
statement = "現有 analyze 與 scan CLI 不被破壞"
catalog_prefixes = []
implementation = ["src/tw_stock_swing/cli.py"]
tests = ["tests/test_cli.py", "tests/test_analysis.py"]
status = "implemented"

[[requirements]]
id = "REQ-AUDIT-001"
statement = "A01–A09：同基準報酬、截止時間、有限值、品質狀態、UTC、部分失敗、交易遮罩、股票身分及官方一致性"
audit_findings = ["A01", "A02", "A03", "A04", "A05", "A06", "A07", "A08", "A09"]
catalog_prefixes = ["market.", "institutional.", "category."]
implementation = ["src/tw_stock_swing/analysis.py", "src/tw_stock_swing/providers.py", "src/tw_stock_swing/sources/official.py", "src/tw_stock_swing/research.py", "src/tw_stock_swing/storage.py", "src/tw_stock_swing/models.py", "src/tw_stock_swing/cli.py"]
tests = ["tests/test_audit_regressions.py"]
status = "implemented"

[[requirements]]
id = "REQ-SAFETY-001"
statement = "盤中未完成日 K、P0 缺口、過期、來源失敗與同日價格衝突必須阻擋正式交易計畫"
catalog_prefixes = ["category.", "market."]
implementation = ["src/tw_stock_swing/analysis.py", "src/tw_stock_swing/research.py", "src/tw_stock_swing/formatting.py"]
tests = ["test_intraday_daily_bar_is_excluded_until_market_close", "tests/test_research.py"]
status = "implemented"

[[requirements]]
id = "REQ-PERSIST-001"
statement = "research 預設保存 run、三時間觀察值、coverage、證據與結論外鍵關聯"
catalog_prefixes = ["category."]
implementation = ["src/tw_stock_swing/research.py", "src/tw_stock_swing/storage.py", "src/tw_stock_swing/cli.py"]
tests = ["test_research_is_persisted_with_evidence_links", "tests/test_storage.py"]
status = "implemented"

[[requirements]]
id = "REQ-FUTURE-001"
statement = "名詞公式、回測、交易制度、風險契約、安全、法律、產業模板與量化驗收需後續展開"
catalog_prefixes = ["category.technical", "category.industry_specific", "category.alternative"]
implementation = ["REQUIREMENTS.md"]
tests = []
status = "planned"
